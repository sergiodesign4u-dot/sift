<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sift - Wireframe 1.0 Auth (log in)</title>
<link rel="stylesheet" href="_wf.css">
</head>
<!--
  Wireframe 1.0 Auth, state base = Log in (1.1). Public / pre-login (Skeleton B): NO app header
  tabs, NO bottom tabs, only a light Sift mark and a centered form card. Email + SSO, a value
  reminder, a forgot-password link (1.2), and a switch to sign up (1.0). Submit lands the returning
  PM on Synthesis (2.0). Text from ia/docs/pages/auth.md. Grey, responsive, noindex.
  Note: the top bar + rail are reviewer chrome; the SCREEN carries no app nav (the PM is not in yet).

  Composition from ia/docs/blocks.md, Type 9 (auth form, light pass):
    1 one credential form, email plus SSO
    3 links between log in and sign up, both directions
    4 forgot password as its own addressable state
    5 errors on the field, not only at the top
  ABSENT deliberately: a wall of six social providers (row 6), each of which is a data-sharing
  decision with no MVP job behind it, and marketing chrome (row 7), because there is one thing
  to do on this screen.
-->
<body>


<div class="wf-shell">
  <div id="wf-rail" data-node="1.0" data-state="base"></div>

  <div class="wf-stage">
    <div class="wf-canvas">
      <div class="wf-app">

        <div class="wf-public-bar">
          <span class="wf-brand">SIFT</span>
          <span class="wf-public-tag">Turn customer feedback into decisions you can defend.</span>
        </div>

        <main class="wf-main wf-public-main">
          <div class="wf-auth-wrap">
            <section class="wf-auth-card">
              <h1 class="wf-h1">Log in</h1>
              <p class="wf-auth-value">Turn scattered customer feedback into clear, prioritized decisions, with the evidence to defend every call.</p>

              <form action="synthesis.html" method="get">
                <div class="wf-field">
                  <label class="wf-label" for="login-email">Work email</label>
                  <input class="wf-input" id="login-email" name="email" type="email" autocomplete="email" placeholder="alex@northwind.io">
                </div>
                <div class="wf-field">
                  <div class="wf-label-row">
                    <label class="wf-label" for="login-password">Password</label>
                    <a class="wf-auth-forgot" href="auth-reset.html">Forgot password</a>
                  </div>
                  <input class="wf-input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password">
                </div>
                <button class="wf-btn wf-auth-btn" type="submit">Log in</button>
                <div class="wf-auth-or">or</div>
                <button class="wf-btn wf-btn--ghost wf-auth-btn" type="submit" formaction="synthesis.html">Continue with SSO</button>
              </form>

              <p class="wf-auth-switch">New to Sift? <a href="auth-signup.html">Sign up</a></p>
            </section>
          </div>
        </main>

        <footer class="wf-appfoot">Sift &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></footer>

      </div>
    </div>
  </div>
</div>

<script src="_nav.js"></script>
</body>
</html>
