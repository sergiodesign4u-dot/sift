<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sift kit - the shell as markup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;590;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>/* stand only: two frames on one page need a gap between them, and the product never has two */
.appframe--next { margin-top: 24px; }</style>
</head>
<!--
  design/kit/shell.html - THE SHELL AS MARKUP, not as CSS.

  A kit that is only a stylesheet cannot dress what has no skeleton. The three organisms that
  are never typed into a product page (app header, bottom tabs, app footer) are injected into
  the grey prototype by wireframes/_nav.js, so they exist in no HTML file anywhere. This file
  is where a colour copy takes them from: open it, copy the block, paste it into the screen.

  Four blocks, in the order a page uses them:
    1. The icon sprite. One set (Solar, stroke), inline SVG, referenced by <use>.
    2. The frame plus the app header: brand, desktop tabs, avatar. Below 820px the tabs
       disappear and the bottom tabs take over. That swap is in kit.css, not here.
    3. The main region and the app footer.
    4. The bottom tabs, mobile navigation, the same four destinations as the header.

  The public document (6.4) uses .public-bar instead of .appbar and no tabs at all: it is a
  read-only artifact with no navigation to offer. Its markup is at the bottom of this file.

  Structure and text stay the property of wireframes/. This file owns nothing but the skeleton
  the colour layer needs in order to be applied. No em dash anywhere.
-->
<body>

<!-- ==== 1. THE ICON SPRITE. One set for the whole product, inline, referenced by <use>. ==== -->
<svg class="sprite" aria-hidden="true"><defs>
  <symbol id="i-signal" viewBox="0 0 24 24"><path d="M6 18v-3.5M12 18v-8M18 18v-12.5"/></symbol>
  <symbol id="i-source" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M5 12v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"/></symbol>
  <symbol id="i-brief" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19c0-3.6 2.9-5.5 6.5-5.5s6.5 1.9 6.5 5.5"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5.5h18l-7 8v5l-4 2v-7z"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 3v18"/><path d="M6 4h12l-2.5 4L18 12H6"/></symbol>
  <symbol id="i-evidence" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-4 4v-4H4z"/><path d="M8.5 10.5h7M8.5 13h4"/></symbol>
  <!-- added at Step 3 for the components that had never been in colour -->
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5 21 19.5H3z"/><path d="M12 10v4.2M12 17.1v.1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-drag" viewBox="0 0 24 24"><path d="M9 7h.1M15 7h.1M9 12h.1M15 12h.1M9 17h.1M15 17h.1"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5"/><path d="m7.5 9.5 4.5-4.5 4.5 4.5"/><path d="M4.5 15v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
</defs></svg>

<div class="page">

<!-- ==== 2 + 3. THE APPLICATION SHELL. Every product screen except 1.x, 6.4, 9.x and 0.0. ==== -->
<div class="appframe">

  <header class="appbar">
    <span class="brand"><svg class="ic mark" width="15" height="15"><use href="#i-signal"></use></svg> Sift</span>
    <nav class="navtabs" aria-label="Sections">
      <a href="#" class="active" aria-current="page">Synthesis</a>
      <a href="#">Sources</a>
      <a href="#">Briefs</a>
    </nav>
    <span class="spacer"></span>
    <a href="#" class="avatar" aria-label="Account"></a>
  </header>

  <main class="appmain">
    <!-- the screen goes here, assembled from the classes on kit.html -->
  </main>

  <footer class="appfoot">Sift workspace &middot; feedback from CSV and Intercom, PII scrubbed by default</footer>

  <!-- ==== 4. BOTTOM TABS. Below 820px only; kit.css swaps them for the header tabs. ==== -->
  <nav class="bottomtabs" aria-label="Sections">
    <a href="#" class="btab active" aria-current="page"><span class="ico"><svg viewBox="0 0 24 24" class="ic"><use href="#i-signal"></use></svg></span>Synthesis</a>
    <a href="#" class="btab"><span class="ico"><svg viewBox="0 0 24 24" class="ic"><use href="#i-source"></use></svg></span>Sources</a>
    <a href="#" class="btab"><span class="ico"><svg viewBox="0 0 24 24" class="ic"><use href="#i-brief"></use></svg></span>Briefs</a>
    <a href="#" class="btab"><span class="ico"><svg viewBox="0 0 24 24" class="ic"><use href="#i-user"></use></svg></span>Account</a>
  </nav>

</div>

<!-- ==== THE PUBLIC SHELL. 6.4 Shared brief, and the same bar carries 0.0 and 9.x. ====
     No tabs and no account: the reader of a shared brief has no session and nothing to
     navigate to. The read-only tag is the first thing the bar says. -->
<div class="appframe appframe--next">
  <header class="public-bar">
    <span class="brand"><svg class="ic mark" width="15" height="15"><use href="#i-signal"></use></svg> Sift</span>
    <span class="spacer"></span>
    <span class="public-tag">read only</span>
  </header>
  <main class="public-main">
    <!-- the document goes here -->
  </main>
  <footer class="pubfoot">Made with Sift</footer>
</div>

</div>
</body>
</html>
